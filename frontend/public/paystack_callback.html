<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Complete - Utonga</title>
    <style>
        body {
            background: #000;
            color: #FFD700;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 2px solid rgba(255, 215, 0, 0.1);
            border-top: 2px solid #FFD700;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 900; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Payment Verified</h1>
    <p style="color: #666; font-size: 10px; margin-top: 10px;">Safe to close this window. Return to the main sanctuary hub.</p>

    <script>
        // High-Fidelity Sync:
        // This window is a "Cleanup Bridge".
        // 1. It lets the user know it's done.
        // 2. It attempts to self-close to return the user to the main tab.
        setTimeout(() => {
            window.close();
        }, 2500);
    </script>
</body>
</html>
