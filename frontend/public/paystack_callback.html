<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utonga Sanctuary - Verification</title>
    <style>
        body {
            background: #000;
            color: #FFD700;
            font-family: 'Space Mono', monospace, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            animation: fadeIn 1s ease-out;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 {
            font-size: 14px;
            letter-spacing: 0.3em;
            margin-bottom: 30px;
            font-weight: 900;
        }
        .btn {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 18px 40px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
            background: #fff;
        }
        .hint {
            margin-top: 25px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🐆</div>
        <h1>Payment Verified</h1>
        <button id="escape-btn" class="btn">Enter Sanctuary Hub</button>
        <p class="hint">Click to claim your Steward Certificate</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const donationId = params.get('id');
        const status = params.get('status') || 'success';

        // Final destination for the PARENT window
        const destination = '/give?status=' + status + '&id=' + donationId;

        const btn = document.getElementById('escape-btn');

        btn.onclick = function(e) {
            e.preventDefault();
            console.log("Attempting breakout...");

            // THE NUCLEAR OPTION:
            // Since Paystack is blocking window.top.location directly,
            // we will try to "close" ourselves or trigger a top-level parent change.

            // Try 1: Standard escape
            try { window.top.location.href = destination; } catch(e) {}

            // Try 2: Open in new tab (This usually works even in strict sandboxes)
            // It will open the Success page in a fresh window, breaking the frame.
            window.open(destination, '_top');

            // Try 3: If still stuck, force a direct link click
            window.location.href = destination;
        };

        // Auto-attempt every second to catch "soft" sandboxes
        setInterval(() => {
            try { window.top.location.href = destination; } catch(e) {}
        }, 1500);
    </script>
</body>
</html>
